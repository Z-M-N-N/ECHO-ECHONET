# VideoMAE (frozen) + MLP regression head — EchoNet-Dynamic
seed: 42
csv: /home/mzhao/Datasets/EchoNet-Dynamic/FileList.csv
video_root: /home/mzhao/Datasets/EchoNet-Dynamic/Videos
video_ext: .mp4

tasks: [EF, ESV, EDV]

encoder:
  weights: /home/mzhao/模型权重/VideoMAE/pytorch_model.bin
  num_frames: 16
  image_size: 224
  pooling: mean           # mean | max | mean_std
  batch_size: 16
  num_workers: 8
  amp_dtype: bfloat16

feature:
  dir: /home/mzhao/ECHO-ECHONET/out/features/videomae
  tag: null

head:
  hidden_dims: [512, 256]
  dropout: 0.2
  activation: gelu
  input_norm: true

train:
  batch_size: 128
  epochs: 200
  lr: 1.0e-3
  weight_decay: 1.0e-4
  loss: mse               # mse | huber
  huber_delta: 1.0
  lr_scheduler: cosine
  patience: 25
  min_delta: 1.0e-5
  grad_clip: 5.0

output:
  root: /home/mzhao/ECHO-ECHONET/out
  run_name: videomae_reg
